# Decision-layer backend chains, escalation bands and the gate. Owner: T3.
# Agent design Sections 5 and 8; agent_graph.md v0.3 Section 4.
# A chain lists backends in order; the next one answers when the previous fails (fallback).

decisions:
  tool:
    v0: [llm]
    v1: [llm]
    v2: [llm]
    v3: [llm]
    v4: [jev, kev, llm]        # phase 1: tool selection stays on Jev; Kev only if Jev is down
    v5: [jev, kev, llm]
    v6: [jev, kev, llm]
  domain:
    v0: [llm]
    v1: [llm]
    v2: [llm]
    v3: [llm]
    v4: [kev, jev, llm]        # phase 1: domain on Kev, escalated to Jev inside the band
    v5: [kev, jev, llm]
    v6: [kev, jev, llm]
  coverage:
    all: [rules]               # Jev for "does this measure match this indicator" is a Should
  chart:
    all: [rules]               # Jev only when the rules leave a tie (Should)
  verification:
    v0: [pass_through]
    v1: [pass_through]
    v2: [pass_through]
    v3: [pass_through]
    v4: [pass_through]
    v5: [jev]                  # Should; abstain with `verifier_unavailable` if Jev is down
    v6: [jev]

escalation:
  # Calibrated maximum probability inside [low, high) is re-asked to Jev. Set on the
  # calibration split for the 5% error budget; null disables escalation.
  domain: {low: null, high: null}
  tool: {low: null, high: null}

gate:
  margin_points: 3             # fine-tuned Kev accuracy may trail Jev's by at most 3 points
  ece_max: 0.10                # after temperature scaling, 10 equal-width bins
  error_budget: 0.05           # for the share handled by Kev in the cascade
  evaluation_set: dev_human
  bootstrap: {resamples: 2000, seed: 0}

parallel_routing: true         # tool and domain asked concurrently in v4+
timeouts_s:
  kev: 10
  jev: 10
  llm: 30
