# Model identifiers by component. Owner: T3. Secrets and the GCP project id come from the
# environment (.env), never from this file.

hosted_llm:
  provider: vertex             # vertex | ai_studio
  # Global endpoint (decided 2026-11-16): the 3.5 models are offered pay-as-you-go only on
  # global, us and eu (not asia-south1); global is about 10% cheaper per token than the others
  # and has the most capacity. Requests may be processed in any region (public data only).
  location: global
  temperature: 0
  # Output-token cap per call purpose (cost guard, T4 document Section 12; initial values).
  # A reply cut at the cap fails validation and is retried once like any malformed reply.
  max_output_tokens:
    intent: 512
    sql: 512
    sql_repair: 512
    narrate: 400
    clarify: 150
    route: 300
  # Reasoning ("thinking") per call purpose, sent as reasoning_effort (maps to thinking_level
  # on Gemini 3). Starting values, to be tuned on e2e_dev. Thinking tokens are billed as output.
  thinking:
    per_purpose:
      route: minimal
      intent: low
      sql: minimal
      sql_repair: low
      narrate: minimal
      clarify: minimal
    on_regenerate:              # a query regenerated after a failed result check
      sql: medium
    # Levels each model accepts; a requested level is moved up to the nearest accepted one.
    # A model not listed gets the requested level unchanged. Check with scripts/check_vertex.py.
    supported_levels:
      gemini-3.5-flash-lite: [minimal, low, medium, high]
      gemini-3.8-flash: [low, medium, high]
      gemini-3.7-flash: [low, medium, high]
  # Default tier for development and all runs: 3.5 Flash-Lite (GA). The comparison tier for E2
  # (3.5 Flash or 3.8 Flash) is to be decided; the version string returned by the API is logged
  # per call.
  tiers:
    small: gemini-3.5-flash-lite
    large: gemini-3.5-flash     # to be decided: gemini-3.5-flash or gemini-3.8-flash
  default_tier: small
  # USD per million tokens, global endpoint, Standard pay-as-you-go. Source: Vertex AI
  # generative AI pricing page (cloud.google.com/vertex-ai/generative-ai/pricing), read through
  # a search excerpt on 2026-11-16; confirm in the console's pricing view.
  price_per_mtok:
    small: {input: 0.30, output: 2.50, checked: 2026-11-16}
    large: {input: null, output: null, checked: null}
  ai_studio_base_url: https://generativelanguage.googleapis.com/v1beta/openai

kev:
  model: jaredpalmer/kev-0.8b
  revision: bf75a6a8848ea6960ff2ed108d9ed44c2941174f
  checkpoint: null             # fine-tuned run id from models/registry.json, once the gate is run
  temperature: null            # fitted on the calibration split; null serves raw probabilities
  serve:
    base_url_env: KEV_BASE_URL
    api_key_env: KEV_API_KEY
    dtype: fp32
    raw_temperature: 1.0       # KEV_TEMPERATURE at the server; scaling is applied by the client

jev:
  model: jev-latest
  backends:
    - {name: typesafe, base_url: https://api.typesafe.ai, api_key_env: TYPESAFE_API_KEY}
    - {name: openrouter, base_url: null, api_key_env: OPENROUTER_API_KEY}   # route to be confirmed

embedding:
  model: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  dim: 384
