# CPI All India (Rural, Urban, Rural+Urban) by month, January 2013 to December 2023. Item groups as columns.

[dataset]
id = "cpi_all_india"
domain = "prices_economy"
title = "Consumer Price Index (base 2012 = 100), All India, rural, urban and combined, by item group and month, January 2013 to December 2023"
source_name = "National Statistics Office, Ministry of Statistics and Programme Implementation"
source_table = "All India Consumer Price Index (Rural/Urban), up to December 2023"
publisher = "Ministry of Statistics and Programme Implementation (via data.gov.in)"
source_tier = "B"
adapter = "ogd_api"
resource_id = "2a6edbfb-b416-48db-9183-645be023f757"
raw_file = "cpi_all_india.csv"
config_version = "1.0.0"
retrieved = "2026-11-05"
caveats = [
  "Values are index numbers with base 2012 = 100, not prices and not inflation rates. Inflation is the percentage change between two index values, usually the same month a year apart.",
  "Each month has three figures: Rural, Urban and Rural+Urban (combined). The General index is the headline CPI.",
  "Data ends in December 2023 and uses MoSPI's older series with base 2012 = 100. MoSPI now publishes a new series with base 2024 = 100; values from the two series cannot be compared directly.",
  "April 2019 is missing from the source for all sectors.",
  "April and May 2020 are missing for most item groups (COVID-19 lockdown, when prices could not be collected).",
  "Housing is compiled for urban areas only, so Rural housing is empty, and Rural+Urban housing is (almost always) the same as the urban figure.",
]

[read]
missing_markers = { "" = "missing_in_source", "NA" = "missing_in_source", "-" = "missing_in_source" }

[columns]
Sector = "category:sector"
Year = "period_year"
Month = "period_month"

