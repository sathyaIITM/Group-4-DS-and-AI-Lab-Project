# Kev-0.8B fine-tuning runs (Milestone 4). Owner: T3.
# Flags were checked against `python -m kev.train --help` at Kev commit
# 2074cc44256200bb37540103fa4572901faa10f3 on 2026-11-12. Re-check after updating the Kev clone.
#
# Constraints found in that check:
# - `--dtype` accepts only fp32 and bf16, and bf16 is CUDA autocast; the Colab T4 has no bf16,
#   so every run uses fp32 (there is no fp16 option).
# - With `--init_from`, the LoRA rank, head dimension, option isolation, special embeddings,
#   base and base revision must equal the released checkpoint's (kev/checkpoint.py,
#   COMPAT_FIELDS): rank 16, head_dim 256. A different rank is possible only from the base model.
# - The learning-rate schedule is OneCycle with 10% warm-up; gradients are clipped at a global
#   norm of 1.0 (constants, not flags). Clipped steps are reported per epoch in the run log.
# - Snapshot and resume flags apply to full-weight training only: a LoRA run cannot resume,
#   and the epoch runs (1, 2, 3) compare training horizons rather than early-stopping points.
# - `--init_from` has no revision flag; a Hub id is pinned with `@revision` (kev/checkpoint.py,
#   resolve_run), otherwise it resolves to the repository's current `main`.
# - Augmentation flags (--p_none, --p_none_distract, --p_distract) default to 0.1/0.12/0.15 and
#   apply to --data records; they are set explicitly in b0 below. Checked again 2026-11-17.

kev_commit: 2074cc44256200bb37540103fa4572901faa10f3

base:
  model: Qwen/Qwen3.5-0.8B-Base
  revision: dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68
init_from:
  model: jaredpalmer/kev-0.8b
  revision: bf75a6a8848ea6960ff2ed108d9ed44c2941174f   # released adapter: LoRA rank 16, head_dim 256

data:
  # Phase-1 (domain only) files built from routing data v2 by
  # `python scripts/build_domain_phase1.py --version v2 --laya`; hashes as in data/MANIFEST.md.
  train: data/splits/kev_domain/train.v2.jsonl
  train_sha256: bd762f0f56dde25df964eadcaf2cd4a95a939ff059e3d2aa15daccfd7e79a54f
  calibration: data/splits/kev_domain/calibration.v2.jsonl
  calibration_sha256: 8d363f6e8c3e34e699041d2f2cce3c85c01ced239574a02e37a016790c3bdcba
  dev_synthetic: data/splits/kev_domain/dev_synthetic.v2.jsonl
  dev_synthetic_sha256: 2fa6eaf2e18df3c9c3a9fc95836487e194154500c5953340f5fc0d6496c48a17
  smoke: data/splits/kev_domain/overfit32.v2.jsonl   # 32 records; the smoke run on each platform
  smoke_sha256: fafb70ccd0201b351efa0fd3608f43f2e3ac5e83fdb2b91a80236fd84f72eaee
  # Routing data v2 itself (tool and domain): data/splits/kev/*.v2.jsonl, hashes in MANIFEST.
  subsets_dir: data/splits/kev_domain/subsets   # train-size runs; written by `kev_runs subsets`

# Phase 2 (Milestone 5, decided 2026-11-24): one Kev model for tool selection and domain, trained
# on routing data v2 (both questions, as one record per question), from the same pinned warm start. The
# recipe is the Milestone 4 selection (`ep3`: B0 with 3 epochs), fixed before any phase 2 score;
# two seeds show the spread. Selection, fixed in advance: one temperature per decision fitted on
# `calibration`; the seed with the lower mean `dev_synthetic` NLL over the two decisions after
# temperature. Adoption: the gate of configs/inference.yaml on the tool labels of dev_human v1.1
# (labelling guide 1.1) and on the domain labels of dev_human.
phase2:
  # One single-question record per decision (scripts/build_phase2_split.py): both questions on
  # one record made the 32-record smoke run grow to about 18 GB on the local machine (24 Nov).
  train: data/splits/kev/phase2_split/train.v2.jsonl   # 3,752 records from the 1,876 of v2
  train_sha256: 1a3c0ba9024dabdea26aca3221725dfdd6d4fee8499add3c6c20b9b394b97747
  joint_source: data/splits/kev/train.v2.jsonl
  joint_source_sha256: 4829691c1b21b5243185fb308e882e7e490e199bf1a67d649e6eeaf6f29ca427
  calibration: data/splits/kev/calibration.v2.jsonl
  calibration_sha256: f1a8fafc64fa829e3fde12375a262366658cec7b9d0faa43af3ce58c4c4b5c2f
  dev_synthetic: data/splits/kev/dev_synthetic.v2.jsonl
  dev_synthetic_sha256: 3a249faf05ac85c099a45a4c6a0d522cbd17df7918186a80f3edfc7f7db9fac3
  smoke: data/splits/kev/phase2_split/overfit32.v2.jsonl   # 64 = 32 joint records split
  smoke_sha256: 3b223d51db5bc1854dc4a437294b61eb54aae903f0b414090314e25b0b6772b8
  recipe: {epochs: 3}
  seeds: [0, 1]

# Base configuration B0 (docs/Kev_Training_Plan.md Section 6, corrected for the flags above).
# Parity phase (Milestone 5; docs/specs/kev_laya_parity_protocol.md, fixed 24 Nov 2026 before any
# run under it). The two best sweep settings by dev_synthetic NLL (ep3, lr4e-05) get seeds 1 and 2
# in the domain cell and seeds 0-2 in the joint cell; one held-out-table run (first-ranked setting).
parity:
  recipes:
    ep3: {epochs: 3}
    lr4e-05: {lr: 4.0e-5}
  domain_seeds: {ep3: [1, 2], lr4e-05: [1, 2]}
  # Joint cell: three seeds per setting. joint_ep3_s0 and _s1 are the phase 2 runs (phase2 above,
  # fixed before any score and unchanged); the parity phase adds the runs below under its own rule.
  joint_seeds: {ep3: [2], lr4e-05: [0, 1, 2]}
  held_out:
    table: srs_imr_state
    recipe: ep3
    seed: 0
    train: data/splits/kev/phase2_split/train_heldout_srs_imr_state.v2.jsonl   # scripts/build_parity_data.py
    train_sha256: ba57c49b538eab573bbc96a45407584301f7d33455e86972dcf14acd56a7ef71

b0:
  lr: 2.0e-5
  epochs: 2
  batch: 1
  accum: 8
  lora: 16
  lora_targets: all
  dtype: fp32
  weights_dtype: fp32
  max_state: 384
  seed: 0
  device: cuda
  # kev.train augments every Choice record per epoch, on the fly (kev/data.py `augment`; the
  # files are not changed): the option order is always shuffled; with probability p_none the
  # true option is removed and a 'none of the above' option becomes the label; p_none_distract
  # adds a 'none' option as a wrong alternative; p_distract adds an unrelated option.
  # Decided 2026-11-17: p_none 0 (the label always stays one of our eight domains; serving never
  # offers a 'none' option); the two label-preserving additions keep the library defaults.
  p_none: 0.0
  p_none_distract: 0.12
  p_distract: 0.15

# One factor at a time from B0. Every run is scored on `calibration` and `dev_synthetic`.
sweep:
  lr: [1.0e-5, 2.0e-5, 4.0e-5]
  epochs: [1, 2, 3]
  train_size: [250, 500, 1000, full]
  seeds: [0, 1, 2]              # for B0 and for the best setting
  # LoRA rank cannot change under --init_from (see above). The rank runs therefore start from
  # the base model and are compared with a from-base B0, which is also generalisation item 1.
  from_base:
    lora: [8, 16, 32]
    lr: 2.0e-4    # fresh adapter and head: kev.train's default learning rate (decided 2026-11-17)

generalisation:
  - id: init_from
    runs: [b0_s0, base_r16]
  - id: held_out_table
    note: deferred, not run; needs its own split (train without one table's records)
  - id: gradient_clipping
    note: report clipped steps per epoch from the run log; compare lr 1e-5 with B0
  - id: seed_spread
    seeds: [0, 1, 2]
  - id: temperature
    note: fitted on calibration, applied unchanged to dev
  - id: option_order
    orders: 3
    note: inference only, on the selected checkpoint (decision_eval run --option-order-seed, flips)
  - id: training_horizon
    note: >-
      ep1, B0 (2 epochs) and ep3 are separate runs, each with its own OneCycle schedule over its
      own length; they compare training horizons, not checkpoints of one run (true early
      stopping would need per-epoch saves, which kev.train offers only for full-weight runs)

# Planned runs (decided 2026-11-17): 8 of the 13 runs of the full sweep above, with the platform
# that trains each. The other 5 (train sizes 250, 500, 1000; from-base ranks 8 and 32) are
# deferred and run only if compute is left after these. All Kev runs train on CUDA T4s (ep1
# moved from the local machine so that no epoch comparison mixes devices); the local machine
# runs the Laya comparator and all scoring.
platforms:
  kaggle: cuda
  colab: cuda
  local: mps
gpus:            # runs trained at once per session
  kaggle: 2
  colab: 1
  local: 1
# Sessions: one list per GPU; a GPU runs its list in order. Each pair is about 2 epochs per GPU.
sessions:
  kaggle_1: [[b0_s0], [lr1e-05]]
  kaggle_2: [[lr4e-05], [b0_s1]]
  kaggle_3: [[ep3], [b0_s2, ep1]]
  colab_1: [[base_r16]]
  kaggle_4: [[joint_ep3_s0], [joint_ep3_s1]]   # phase 2 (Milestone 5)
  # Parity phase (docs/specs/kev_laya_parity_protocol.md), all on Kaggle 2 x T4 (measured: domain
  # 2 epochs 35 min, 3 epochs 54 min, joint ep3 128 min; 2-epoch joint estimated 85). The four
  # domain seeds were first planned as Colab sessions colab_2..colab_5 and moved to kaggle_6
  # (26 Nov) when a second Kaggle account became available; settings and seeds are unchanged.
  kaggle_6: [[lr4e-05_s1, ep3_s1], [lr4e-05_s2, ep3_s2]]
  kaggle_5: [[joint_ep3_s2, heldout_joint_ep3_s0], [joint_lr4e-05_s0, joint_lr4e-05_s1, joint_lr4e-05_s2]]
planned:
  b0_s0: kaggle
  lr1e-05: kaggle
  lr4e-05: kaggle
  ep3: kaggle
  b0_s1: kaggle
  b0_s2: kaggle
  ep1: kaggle
  base_r16: colab
  joint_ep3_s0: kaggle
  joint_ep3_s1: kaggle
  # parity phase
  lr4e-05_s1: kaggle
  lr4e-05_s2: kaggle
  ep3_s1: kaggle
  ep3_s2: kaggle
  joint_ep3_s2: kaggle
  joint_lr4e-05_s0: kaggle
  joint_lr4e-05_s1: kaggle
  joint_lr4e-05_s2: kaggle
  heldout_joint_ep3_s0: kaggle
# Priority if sessions fail: b0_s0, then lr1e-05 and lr4e-05, then the seeds, ep3 and ep1,
# base_r16.

# Model selection (fixed before any dev_human score; docs/specs/kev_training_protocol.md):
# the temperature is fitted on `calibration`; the checkpoint is chosen on `dev_synthetic` NLL
# after that temperature, macro-F1 breaking ties; only planned runs compete; a setting replaces
# B0 only if its NLL is below the mean of the three B0 seeds by more than their range
# (max - min), otherwise the B0 seed with the lowest NLL is chosen. A range heuristic, not a
# significance test. dev_human is the test set.
selection:
  fit_temperature_on: calibration
  select_on: dev_synthetic
  metric: nll_after_temperature
  tie_break: macro_f1
  noise_floor: b0_seed_range

# Commands are built from this file by `python -m analyst.models.kev_runs plan`
# (planned runs only; `--all` lists the full sweep).
