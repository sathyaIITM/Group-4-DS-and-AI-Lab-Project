[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "india-analyst-agent"
version = "0.0.0"
description = "An analyst agent for Indian public data with calibrated decision models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "duckdb>=1.1",
  "sqlglot>=25.0",
  "pyarrow>=17.0",
  "pandas>=2.2",
  "langgraph>=0.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "structlog>=24.4",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.1"]
optimise = ["dspy-ai>=2.5"]
train = ["torch>=2.4", "transformers>=4.45", "peft>=0.13", "datasets>=3.0"]
eval = ["scikit-learn>=1.5", "scipy>=1.14", "matplotlib>=3.9"]
trace = ["langfuse>=2.50"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
]

[project.urls]
Repository = "https://github.com/sathyaIITM/Group-4-DS-and-AI-Lab-Project"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "S", "C4", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"notebooks/*" = ["ANN", "E402"]

[tool.mypy]
python_version = "3.12"
packages = ["analyst", "app"]
mypy_path = "src:."
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "langgraph.*", "pgvector.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: runs longer than a few seconds",
  "needs_gpu: requires a GPU endpoint",
  "needs_api: requires a hosted model API key",
]
