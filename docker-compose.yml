# Deployment stack: one Compute Engine VM (e2-standard-2 or e2-medium).
# Kev runs on a separate GPU endpoint for demonstrations and reviews only;
# it is not part of this stack. See infra/README.md.

name: india-analyst

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ui
      - api
      - admin

  ui:
    build:
      context: .
      dockerfile: app/ui/Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-analyst}
      DATA_DIR: /data/processed
      STREAM_EVENT_DELAY_S: ${STREAM_EVENT_DELAY_S:-0.1}
      # Decision-model and hosted-LLM backends. Values come from .env; never commit them.
      KEV_BASE_URL: ${KEV_BASE_URL:-}
      KEV_API_KEY: ${KEV_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      # Versioned Parquet, mounted read-only: all SQL execution is read-only.
      - ./data/processed:/data/processed:ro
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: app/admin/Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-analyst}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-analyst}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-analyst}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-analyst}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  db_data:
